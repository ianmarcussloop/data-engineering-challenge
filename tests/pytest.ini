[pytest]
# Test configuration for the TDD workflow

# Verbose output by default
addopts = -v --tb=short --continue-on-collection-errors

# Test paths
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeout for slow tests (E2E tests may take time)
# timeout = 60

# Markers for test categorization
markers =
    slow: marks tests as slow (E2E tests)
    integration: marks integration tests
    unit: marks unit tests
    infrastructure: marks infrastructure verification tests
    kafka: marks tests that require Kafka infrastructure
    postgres: marks tests that require PostgreSQL infrastructure

# Disable warnings
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
